<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Owner Login</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#f5f5f7;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:38px;
    border-radius:28px;
    box-shadow:0 12px 35px rgba(0,0,0,.08);
}

h1{
    margin:0 0 30px;
    font-size:38px;
}

input{
    width:100%;
    height:65px;
    padding:16px;
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:15px;
    font-size:17px;
}

button{
    width:100%;
    height:65px;
    margin-top:20px;
    border:0;
    border-radius:15px;
    background:#111;
    color:white;
    font-size:18px;
    font-weight:bold;
}

#status{
    margin-top:20px;
    text-align:center;
}

</style>

</head>

<body>

<div class="card">

<h1>Owner Login</h1>

<input
    id="email"
    type="email"
    placeholder="Email"
>

<input
    id="password"
    type="password"
    placeholder="Password"
>

<button onclick="login()">
    Login
</button>

<div id="status"></div>

</div>


<script>

const SUPABASE_URL =
"https://merkpcjthrcmjjtlnxkb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IRgNBmjcqMYKeZKZpOXyXA_HjJ0OB-H";


async function login(){

    const email =
    document.getElementById("email")
    .value.trim();

    const password =
    document.getElementById("password")
    .value;

    const status =
    document.getElementById("status");


    if(!email || !password){

        status.innerText=
        "Enter email and password.";

        return;
    }


    status.innerText="Logging in...";


    try{

        const response =
        await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=password",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json",

                    "apikey":
                    SUPABASE_KEY
                },

                body:JSON.stringify({
                    email:email,
                    password:password
                })
            }
        );


        const data =
        await response.json();


        if(!response.ok){

            throw new Error(
                data.msg ||
                data.message ||
                "Login failed."
            );
        }


        localStorage.setItem(
            "access_token",
            data.access_token
        );

        localStorage.setItem(
            "refresh_token",
            data.refresh_token
        );


        window.location.href=
        "inbox.html";


    }catch(error){

        status.innerText=
        "❌ " + error.message;

    }

}

</script>

</body>

</html>
