<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Anonymous Message</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#f5f5f7;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:520px;
  background:#fff;
  padding:32px;
  border-radius:28px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
}

h1{
  margin:0 0 10px;
  font-size:38px;
}

.subtitle{
  color:#666;
  font-size:16px;
  line-height:1.5;
  margin-bottom:25px;
}

input,
textarea{
  width:100%;
  padding:16px;
  border:1px solid #ddd;
  border-radius:15px;
  font-size:17px;
  outline:none;
  font-family:Arial,Helvetica,sans-serif;
}

input{
  height:60px;
  margin-bottom:15px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#999;
}

button{
  width:100%;
  height:62px;
  margin-top:16px;
  border:0;
  border-radius:15px;
  background:#111;
  color:#fff;
  font-size:18px;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
}

#status{
  margin-top:18px;
  text-align:center;
  line-height:1.5;
}

.success{
  background:#f1f1f1;
  padding:18px;
  border-radius:16px;
  margin-top:20px;
}

.linkBox{
  width:100%;
  padding:14px;
  background:#f5f5f7;
  border-radius:12px;
  word-break:break-all;
  font-size:14px;
  margin-top:12px;
}

.copy{
  margin-top:12px;
}

.open{
  margin-top:10px;
  background:#fff;
  color:#111;
  border:1px solid #ddd;
}

</style>

</head>


<body>

<div class="card">

<h1>
Anonymous ✦
</h1>

<div class="subtitle">
Send an anonymous message. Your identity stays private.
</div>


<div id="form">

<input
  id="name"
  type="text"
  maxlength="50"
  placeholder="Mysterious Name ✦"
>


<textarea
  id="message"
  maxlength="2000"
  placeholder="Write your anonymous message..."
></textarea>


<button
  id="sendButton"
  onclick="sendMessage()"
>
Send Anonymously
</button>

</div>


<div id="status"></div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://merkpcjthrcmjjtlnxkb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IRgNBmjcqMYKeZKZpOXyXA_HjJ0OB-H";


/* =====================================
   RECORD WEBSITE VISIT
===================================== */

async function recordWebsiteVisit(){

  try{

    await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/log_website_visit",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY
        },

        body:JSON.stringify({})
      }
    );

  }catch(error){

    console.error(
      "Visit recording failed:",
      error
    );

  }

}


/* Record visit immediately */

recordWebsiteVisit();


/* =====================================
   GENERATE PRIVATE TOKEN
===================================== */

function generateToken(){

  const bytes =
    new Uint8Array(32);

  crypto.getRandomValues(bytes);


  return Array
    .from(bytes)
    .map(
      b =>
        b.toString(16).padStart(2,"0")
    )
    .join("");

}


/* =====================================
   SEND MESSAGE
===================================== */

async function sendMessage(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const message =
    document
      .getElementById("message")
      .value
      .trim();


  const status =
    document.getElementById(
      "status"
    );


  const button =
    document.getElementById(
      "sendButton"
    );


  if(!name){

    status.innerText =
      "Please enter a name.";

    return;

  }


  if(!message){

    status.innerText =
      "Please write a message.";

    return;

  }


  button.disabled = true;

  button.innerText =
    "Sending...";

  status.innerText = "";


  const token =
    generateToken();


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/create_conversation",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY
          },

          body:JSON.stringify({
            p_name:name,
            p_message:message,
            p_token:token
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        data.hint ||
        "Could not send message."
      );

    }


    /* =================================
       PRIVATE CONVERSATION URL
    ================================= */

    const conversationURL =
      window.location.origin +
      "/anonymous-website/conversation.html?token=" +
      encodeURIComponent(token);


    document.getElementById(
      "form"
    ).style.display = "none";


    status.innerHTML = "";


    const success =
      document.createElement(
        "div"
      );


    success.className =
      "success";


    success.innerHTML = `
      <strong>Message sent ✦</strong>
      <br><br>
      Keep this private conversation link.
      You can use it later to see replies.
    `;


    const linkBox =
      document.createElement(
        "div"
      );


    linkBox.className =
      "linkBox";


    linkBox.innerText =
      conversationURL;


    success.appendChild(
      linkBox
    );


    const copyButton =
      document.createElement(
        "button"
      );


    copyButton.className =
      "copy";


    copyButton.innerText =
      "Copy Private Link";


    copyButton.onclick =
      async function(){

        try{

          await navigator.clipboard.writeText(
            conversationURL
          );

          copyButton.innerText =
            "Copied ✓";

        }catch(error){

          const temp =
            document.createElement(
              "textarea"
            );

          temp.value =
            conversationURL;

          document.body.appendChild(
            temp
          );

          temp.select();

          document.execCommand(
            "copy"
          );

          temp.remove();

          copyButton.innerText =
            "Copied ✓";

        }

      };


    success.appendChild(
      copyButton
    );


    const openButton =
      document.createElement(
        "button"
      );


    openButton.className =
      "open";


    openButton.innerText =
      "Open Conversation";


    openButton.onclick =
      function(){

        window.location.href =
          conversationURL;

      };


    success.appendChild(
      openButton
    );


    status.appendChild(
      success
    );


  }catch(error){

    console.error(error);


    status.innerText =
      "❌ " +
      error.message;


    button.disabled =
      false;


    button.innerText =
      "Send Anonymously";

  }

}

</script>

</body>

</html>
