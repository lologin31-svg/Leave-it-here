<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Private Conversation</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  background:#f5f5f7;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  min-height:100vh;
  padding:25px 14px;
  display:flex;
  justify-content:center;
}

.card{
  width:100%;
  max-width:560px;
  background:#fff;
  border-radius:24px;
  padding:25px 20px;
  box-shadow:0 10px 30px rgba(0,0,0,.07);
}

.title{
  margin:0 0 22px;
  font-size:32px;
}

.message{
  background:#ededee;
  border-radius:18px;
  padding:16px;
  margin:12px 0;
  word-break:break-word;
  white-space:pre-wrap;
}

.message.owner{
  background:#111;
  color:#fff;
}

.sender{
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
  color:#777;
}

.owner .sender{
  color:#bbb;
}

.body{
  font-size:17px;
  line-height:1.45;
}

.time{
  margin-top:9px;
  font-size:11px;
  color:#888;
}

.owner .time{
  color:#aaa;
}

textarea{
  width:100%;
  min-height:120px;
  margin-top:20px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:15px;
  font-size:17px;
  font-family:Arial,Helvetica,sans-serif;
  resize:vertical;
  outline:none;
}

textarea:focus{
  border-color:#999;
}

button{
  width:100%;
  height:58px;
  margin-top:12px;
  background:#111;
  color:#fff;
  border:0;
  border-radius:15px;
  font-size:17px;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
}

.loading{
  color:#777;
  text-align:center;
  padding:20px;
}

.error{
  color:#d00000;
  font-weight:bold;
}

#status{
  text-align:center;
  margin-top:12px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="page">
<div class="card">

<h1 class="title">💬 Private Conversation</h1>

<div id="messages">
<div class="loading">Loading conversation...</div>
</div>

<textarea
  id="reply"
  placeholder="Write your reply..."
></textarea>

<button
  id="replyButton"
  onclick="sendReply()"
>
Reply
</button>

<div id="status"></div>

</div>
</div>

<script>

const SUPABASE_URL =
"https://merkpcjthrcmjjtlnxkb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IRgNBmjcqMYKeZKZpOXyXA_HjJ0OB-H";

const token =
new URLSearchParams(
  window.location.search
).get("token");


function formatDateTime(value){

  if(!value) return "";

  const date = new Date(value);

  if(isNaN(date.getTime())) return "";

  return new Intl.DateTimeFormat(
    "en-IN",
    {
      timeZone:"Asia/Kolkata",
      day:"numeric",
      month:"short",
      year:"numeric",
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }
  ).format(date);
}


/* =========================
   MARK OWNER MESSAGES SEEN
========================= */

async function markOwnerMessagesSeen(){

  if(!token) return;

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/mark_owner_messages_seen",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer "+SUPABASE_KEY
          },
          body:JSON.stringify({
            p_token:token
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){
      console.error(
        "Seen error:",
        data
      );
    }else{
      console.log(
        "Owner messages marked seen:",
        data
      );
    }

  }catch(error){

    console.error(
      "Seen request failed:",
      error
    );

  }
}


/* =========================
   LOAD CONVERSATION
========================= */

async function loadConversation(){

  const box =
    document.getElementById("messages");

  if(!token){

    box.innerHTML =
      '<div class="error">❌ Private link is invalid.</div>';

    return;
  }

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/get_conversation",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer "+SUPABASE_KEY
          },
          body:JSON.stringify({
            p_token:token
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        data.hint ||
        "Could not load conversation."
      );
    }


    /* Mark owner's messages as seen */
    await markOwnerMessagesSeen();


    box.innerHTML="";


    if(
      !data.messages ||
      data.messages.length===0
    ){

      box.innerHTML =
        '<div class="loading">No messages yet.</div>';

      return;
    }


    data.messages.forEach(function(m){

      const message =
        document.createElement("div");

      message.className="message";


      if(m.sender_type==="owner"){
        message.classList.add("owner");
      }


      const sender =
        document.createElement("div");

      sender.className="sender";

      sender.innerText =
        m.sender_type==="owner"
        ? "Aadhi"
        : "You";


      const body =
        document.createElement("div");

      body.className="body";

      body.innerText =
        m.body || "";


      const time =
        document.createElement("div");

      time.className="time";

      time.innerText =
        formatDateTime(m.created_at);


      message.appendChild(sender);
      message.appendChild(body);
      message.appendChild(time);

      box.appendChild(message);

    });

  }catch(error){

    console.error(error);

    box.innerHTML =
      '<div class="error">❌ ' +
      error.message +
      '</div>';
  }
}


/* =========================
   SEND REPLY
========================= */

async function sendReply(){

  const textarea =
    document.getElementById("reply");

  const button =
    document.getElementById("replyButton");

  const status =
    document.getElementById("status");

  const message =
    textarea.value.trim();

  if(!message){

    status.innerText =
      "Write a reply first.";

    return;
  }


  button.disabled=true;
  button.innerText="Sending...";
  status.innerText="";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/send_reply",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer "+SUPABASE_KEY
          },
          body:JSON.stringify({
            p_token:token,
            p_message:message
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        data.hint ||
        "Could not send reply."
      );
    }


    textarea.value="";

    status.innerText="Reply sent ✓";

    await loadConversation();

  }catch(error){

    console.error(error);

    status.className="error";

    status.innerText =
      "❌ " + error.message;

  }finally{

    button.disabled=false;
    button.innerText="Reply";

  }
}


loadConversation();

setInterval(
  loadConversation,
  10000
);

</script>

</body>
</html>
