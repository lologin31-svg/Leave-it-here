<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Private Conversation</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f5f7;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  min-height:100vh;
  padding:25px 14px;
  display:flex;
  justify-content:center;
}

.card{
  width:100%;
  max-width:560px;
  background:#fff;
  border-radius:24px;
  padding:25px 20px;
  box-shadow:0 10px 30px rgba(0,0,0,.07);
}

.title{
  margin:0 0 22px;
  font-size:32px;
  line-height:1.1;
}

.message{
  background:#f0f0f1;
  border-radius:16px;
  padding:15px;
  margin:10px 0;
}

.message.owner{
  background:#111;
  color:#fff;
}

.sender{
  font-size:13px;
  color:#777;
  font-weight:bold;
  margin-bottom:6px;
}

.owner .sender{
  color:#ccc;
}

.body{
  font-size:16px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
}

.time{
  margin-top:9px;
  font-size:11px;
  color:#888;
}

.owner .time{
  color:#aaa;
}

textarea{
  width:100%;
  height:110px;
  margin-top:18px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:15px;
  font-family:Arial,Helvetica,sans-serif;
  resize:none;
  outline:none;
}

textarea:focus{
  border-color:#999;
}

button{
  width:100%;
  height:50px;
  margin-top:9px;
  border:0;
  border-radius:14px;
  background:#111;
  color:#fff;
  font-size:15px;
  font-weight:600;
}

button:disabled{
  opacity:.6;
}

#status{
  text-align:center;
  margin-top:12px;
  font-size:14px;
}

.error{
  color:#d00000;
  font-weight:600;
}

.loading{
  color:#777;
  text-align:center;
  padding:20px 0;
}

</style>

</head>

<body>

<div class="page">

<div class="card">

<h1 class="title">
💬 Private Conversation
</h1>

<div id="messages">
  <div class="loading">
    Loading conversation...
  </div>
</div>

<textarea
  id="reply"
  placeholder="Write your reply..."
></textarea>

<button
  id="replyButton"
  onclick="sendReply()"
>
Reply
</button>

<div id="status"></div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://merkpcjthrcmjjtlnxkb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IRgNBmjcqMYKeZKZpOXyXA_HjJ0OB-H";

const token =
new URLSearchParams(
  window.location.search
).get("token");


/* =========================
   DATE + TIME
========================= */

function formatDateTime(dateString){

  const date =
    new Date(dateString);

  return new Intl.DateTimeFormat(
    "en-IN",
    {
      timeZone:"Asia/Kolkata",
      day:"numeric",
      month:"short",
      year:"numeric",
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }
  ).format(date);

}


/* =========================
   LOAD CONVERSATION
========================= */

async function loadConversation(){

  const box =
    document.getElementById(
      "messages"
    );


  if(!token){

    box.innerHTML =
      '<div class="error">❌ No private token found.</div>';

    return;
  }


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/get_conversation",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + SUPABASE_KEY
          },

          body:JSON.stringify({
            p_token:token
          })
        }
      );


    const data =
      await response.json();


    console.log(
      "Conversation response:",
      data
    );


    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        data.hint ||
        "Conversation could not be loaded."
      );

    }


    box.innerHTML="";


    if(
      !data.messages ||
      data.messages.length===0
    ){

      box.innerHTML =
        '<div class="loading">No messages yet.</div>';

      return;
    }


    data.messages.forEach(
      function(message){

        const item =
          document.createElement("div");

        item.className =
          "message";


        if(
          message.sender_type==="owner"
        ){

          item.classList.add(
            "owner"
          );

        }


        const sender =
          document.createElement("div");

        sender.className =
          "sender";

        sender.innerText =
          message.sender_type==="owner"
          ? "Owner"
          : "Anonymous";


        const body =
          document.createElement("div");

        body.className =
          "body";

        body.innerText =
          message.body;


        const time =
          document.createElement("div");

        time.className =
          "time";

        time.innerText =
          formatDateTime(
            message.created_at
          );


        item.appendChild(sender);

        item.appendChild(body);

        item.appendChild(time);

        box.appendChild(item);

      }
    );


  }catch(error){

    console.error(error);

    box.innerHTML =
      '<div class="error">❌ ' +
      error.message +
      '</div>';

  }

}


/* =========================
   SEND ANONYMOUS REPLY
========================= */

async function sendReply(){

  const textarea =
    document.getElementById(
      "reply"
    );

  const button =
    document.getElementById(
      "replyButton"
    );

  const status =
    document.getElementById(
      "status"
    );


  const message =
    textarea.value.trim();


  if(!message){

    status.className =
      "error";

    status.innerText =
      "Write a reply first.";

    return;
  }


  button.disabled=true;

  button.innerText =
    "Sending...";

  status.className="";

  status.innerText="";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/send_reply",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + SUPABASE_KEY
          },

          body:JSON.stringify({

            p_token:token,

            p_message:message

          })
        }
      );


    const data =
      await response.json();


    console.log(
      "Reply response:",
      data
    );


    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        data.hint ||
        "Reply failed."
      );

    }


    textarea.value="";

    status.innerText =
      "✓ Reply sent";

    await loadConversation();


  }catch(error){

    console.error(error);

    status.className =
      "error";

    status.innerText =
      "❌ " + error.message;

  }


  button.disabled=false;

  button.innerText =
    "Reply";

}


/* =========================
   START
========================= */

loadConversation();


/*
  Automatically refresh every
  10 seconds so new replies appear.
*/

setInterval(
  loadConversation,
  10000
);

</script>

</body>
</html>
